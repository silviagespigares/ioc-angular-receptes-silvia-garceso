
<main class="contenidor">
  <header class="capcalera">
    <h1>{{ appName }}</h1>
    <p>Descobreix receptes casolanes per a tots els gustos.</p>
  </header>

  <app-recepta-filtres
    [categories]="categories"
    (categoriaCanviada)="aplicarFiltre($event)"
  />

  @if (receptaSeleccionada; as recepta) {
    <section class="seleccio" aria-live="polite">
      <p>
        Has seleccionat:
        <strong>{{ recepta.nom }}</strong>
      </p>
      <button type="button" (click)="receptaSeleccionada = null">
        Tancar
      </button>
    </section>
  }

  <app-recepta-llista
    [receptes]="receptesFiltrades"
    (receptaSeleccionada)="seleccionarRecepta($event)"
  />

  <footer>
    <p>Projecte Angular — EAC2</p>
  </footer>
</main>
