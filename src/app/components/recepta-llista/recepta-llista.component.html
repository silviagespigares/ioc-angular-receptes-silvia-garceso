<section class="llista">
  <h2>Llistat de receptes</h2>

  <p class="comptador" aria-live="polite">
    Nombre de receptes: {{ receptes.length }}
  </p>

  @if (receptes.length > 0) {
    <div class="graella">
      @for (recepta of receptes; track recepta.id) {
        <app-recepta-targeta
          [recepta]="recepta"
          (seleccionada)="seleccionarRecepta($event)"
        />
      }
    </div>
  } @else {
    <p class="buit" role="status">
      No s'han trobat receptes amb aquests filtres.
    </p>
  }
</section>
