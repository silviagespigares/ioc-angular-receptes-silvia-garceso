
<section class="filtres">
  <label for="categoria">Filtra per categoria:</label>

  <select id="categoria" [(ngModel)]="categoriaSeleccionada">
    <option value="">Totes les categories</option>

    @for (categoria of categories; track categoria) {
      <option [value]="categoria">{{ categoria }}</option>
    }
  </select>

  <button type="button" (click)="aplicarFiltre()">
    Aplicar filtre
  </button>
</section>
