
<form #formulari="ngForm" class="filtres" (ngSubmit)="aplicarFiltre()">
  <div class="camp">
    <label for="textCerca">Cerca per nom o descripció:</label>

    <input
      id="textCerca"
      name="textCerca"
      type="text"
      [(ngModel)]="textCerca"
      required
      minlength="3"
      #textCercaControl="ngModel"
      placeholder="Escriu almenys 3 caràcters"
    />

    @if (textCercaControl.invalid && (textCercaControl.dirty || textCercaControl.touched)) {
      <p class="error" role="alert">
        @if (textCercaControl.errors?.['required']) {
          El text de cerca és obligatori.
        } @else if (textCercaControl.errors?.['minlength']) {
          El text de cerca ha de tenir com a mínim 3 caràcters.
        }
      </p>
    }
  </div>

  <div class="camp">
    <label for="categoria">Filtra per categoria:</label>

    <select
      id="categoria"
      name="categoria"
      [(ngModel)]="categoriaSeleccionada"
    >
      <option value="">Totes les categories</option>

      @for (categoria of categories; track categoria) {
        <option [value]="categoria">{{ categoria }}</option>
      }
    </select>
  </div>

  <div class="accions">
    <button type="submit" [disabled]="formulari.invalid">
      Aplicar filtre
    </button>

    <button type="button" class="boto-restablir" (click)="restablirFiltres()">
      Restablir filtres
    </button>
  </div>
</form>
